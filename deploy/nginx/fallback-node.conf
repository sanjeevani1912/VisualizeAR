# FALLBACK routing: /api/ goes to the old Node API on the host (port 4000). Everything else as stack.conf. Same origin => no CORS headers needed.
server {
    listen 80;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 12m;   # API allows 10 MB images

    # ---- Map server (Caddy on host port 8088). Trailing slashes strip the /map prefix. ----
    location /map/ {
        proxy_pass http://host.docker.internal:8088/;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header Accept-Encoding "";   # plain text upstream so sub_filter can rewrite
        # The map server bakes PUBLIC_URL into style.json and tiles/india.json.
        # Rewrite it per request so phone, laptop and localhost each get URLs that work for them.
        sub_filter_once off;
        sub_filter_types application/json;
        sub_filter 'http://localhost:8088' '$scheme://$http_host/map';
    }

    # Big offline download: no buffering, ranges pass straight through, no rewriting.
    location /map/files/ {
        proxy_pass http://host.docker.internal:8088/files/;
        proxy_set_header Host $host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ---- API: FALLBACK: the old Node API running on this PC at port 4000 ----
    # X-Forwarded-For: Nginx appends the real client address LAST; Django (TRUST_PROXY=true) uses the last entry.
    location /api/ {
        proxy_pass http://host.docker.internal:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # The API already sets these headers; Nginx sets them for every route, so drop the upstream copy (no duplicates).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # ---- Dashboard (single-page app) ----
    location / {
        root /usr/share/nginx/html;
        try_files $uri @spa;
    }
    location @spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        error_page 404 = @nodash;
    }
    location @nodash {
        default_type text/plain;
        return 404 "Dashboard not built yet. Run: cd web && npm run build (then reload this page).
";
    }
}
