# Nginx: the single address (port 8000) for dashboard (/), API (/api/) and map (/map/).
# Start: docker compose -f deploy/docker-compose.nginx.yml up -d
services:
  nginx:
    image: nginx:1.28-alpine
    ports: ["8000:80"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../web/dist:/usr/share/nginx/html:ro     # build the dashboard first: cd web && npm run build
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
